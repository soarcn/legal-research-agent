[project]
name = "australian-legal-research-agent"
version = "0.1.0"
description = "Local-first, evidence-grounded legal RAG research system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.34",
  "weaviate-client>=4.10",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pip-audit>=2.9",
  "pyright>=1.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
agent = [
  "pydantic-ai>=0.0.24",
]
embedding = [
    "sentence-transformers>=5.0,<6.0",
]
reranker = [
    "sentence-transformers>=5.0,<6.0",
]

[tool.uv]
required-version = "==0.11.26"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "real_service: requires explicitly enabled local Docker services (RUN_REAL_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # Ruff-specific
  "N",     # pep8-naming
  "T20",   # flake8-print (no print in production code)
  "PTH",   # flake8-use-pathlib
  "ASYNC", # async linting
]
ignore = [
  "E501",  # line length managed by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]  # allow print in tests
"scripts/**" = ["T20"]  # allow print in scripts

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Darwin"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["src", "apps", "scripts"]

[tool.coverage.run]
source = ["src/legal_research", "apps"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
